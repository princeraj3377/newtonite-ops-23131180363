services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      # Local development credentials; this database is not exposed to the host.
      POSTGRES_USER: newtonite
      POSTGRES_PASSWORD: newtonite_dev
      POSTGRES_DB: newtonite_ops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: newtonite-ops-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Use the Compose database instead of DATABASE_URL from the host .env.
      DATABASE_URL: postgresql+psycopg://newtonite:newtonite_dev@db:5432/newtonite_ops
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in backend/.env}
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -c
      - alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
